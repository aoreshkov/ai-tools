version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init/analyze are separate Dependabot dependencies, but CodeQL errors out when they
      # run at different versions ("Loaded a configuration file for version X, but running
      # version Y"). Group them so they bump in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
